name: Build iOS App (.ipa)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'frontend/**'
      - '.github/workflows/build-ios.yml'

jobs:
  build-ios:
    name: Build iOS .ipa (Capacitor)
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Verify Locales and Test
        working-directory: frontend
        run: |
          node scripts/check-locales.mjs
          npm test -- --run

      - name: Build Web Assets (Mobile Native Mode)
        working-directory: frontend
        run: VITE_MOBILE=1 npm run build

      - name: Sync Capacitor iOS
        working-directory: frontend
        run: npx cap sync ios

      - name: Install CocoaPods
        working-directory: frontend/ios/App
        run: pod install

      - name: Build Xcode Archive (.app)
        working-directory: frontend/ios/App
        run: |
          xcodebuild build \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination generic/platform=iOS \
            -derivedDataPath ../../../build/derivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package .ipa
        run: |
          mkdir -p build/Payload
          cp -r build/derivedData/Build/Products/Release-iphoneos/App.app build/Payload/
          cd build
          zip -r openGym.ipa Payload
          ls -lh openGym.ipa

      - name: Upload .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openGym-iOS
          path: build/openGym.ipa
          retention-days: 14
